<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralMind AI - Ideias Infinitas</title>
    <style>
        :root { --primary: #00f2fe; --secondary: #4facfe; --bg: #0d1117; --card: #161b22; --border: #30363d; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #c9d1d9; margin: 0; display: flex; justify-content: center; height: 100vh; }
        .container { width: 100%; max-width: 700px; display: flex; flex-direction: column; background: var(--card); border-inline: 1px solid var(--border); }
        header { padding: 15px; text-align: center; border-bottom: 1px solid var(--border); background: #1c2128; }
        header h1 { margin: 0; font-size: 1.3rem; color: var(--primary); }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 15px; border-radius: 12px; max-width: 85%; line-height: 1.5; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; } }
        .ai { align-self: flex-start; background: #21262d; border: 1px solid var(--border); }
        .user { align-self: flex-end; background: #1f6feb; color: white; }
        .input-area { padding: 15px; background: #0d1117; display: flex; gap: 10px; border-top: 1px solid var(--border); }
        input { flex: 1; background: #21262d; border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: white; outline: none; }
        button { background: linear-gradient(45deg, var(--primary), var(--secondary)); border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .script-step { background: #0d1117; padding: 10px; border-radius: 6px; margin-top: 10px; border-left: 3px solid var(--secondary); }
        b { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <header><h1>🚀 ViralMind AI v3.0</h1></header>
    <div id="chat-box">
        <div class="message ai">Olá! Qual o tema de hoje? Eu garanto que cada ideia será única!</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Tema ou 'me dê mais ideias'..." onkeypress="if(event.key === 'Enter') handleSend()">
        <button onclick="handleSend()">GERAR</button>
    </div>
</div>

<script>
    let currentTopic = "";
    let usedIdeas = new Set(); // Armazena o que já foi dito

    const baseTemplates = [
        "Como ganhar tempo com [TEMA] usando IA.",
        "O maior erro que cometem em [TEMA] e ninguém percebe.",
        "3 ferramentas secretas para dominar [TEMA].",
        "POV: Você descobriu o segredo de [TEMA].",
        "Por que você deveria parar de ignorar [TEMA] em 2024.",
        "O guia definitivo para [TEMA] em 30 segundos.",
        "A verdade chocante sobre [TEMA] que não te contam.",
        "Como eu saí do zero em [TEMA] com este método.",
        "Desafio: 7 dias fazendo [TEMA] da forma certa.",
        "A rotina matinal perfeita para quem quer [TEMA]."
    ];

    function handleSend() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        appendMessage('user', text);
        input.value = "";

        setTimeout(() => {
            const q = text.toLowerCase();
            let response = "";

            // Se for pedido de roteiro
            if (q.includes("roteiro") || q.includes("escreva")) {
                response = generateScript();
            } 
            // Se for pedido de ideias
            else {
                if (!q.includes("mais") && !q.includes("outra")) {
                    currentTopic = text;
                    usedIdeas.clear(); // Novo tema, reseta as repetições
                }
                response = generateUniqueIdeas();
            }
            appendMessage('ai', response);
        }, 600);
    }

    function generateUniqueIdeas() {
        let ideasFound = 0;
        let html = `💡 <b>NOVAS IDEIAS PARA: ${currentTopic.toUpperCase()}</b><br><br>`;
        
        // Tenta encontrar 3 ideias que ainda não foram usadas
        let availableTemplates = baseTemplates.filter(t => !usedIdeas.has(t));

        // Se acabarem as ideias base, criamos variações dinâmicas
        if (availableTemplates.length < 3) {
            availableTemplates = [
                `Como aplicar [TEMA] no seu dia a dia.`,
                `O que acontece se você misturar [TEMA] com produtividade.`,
                `A técnica de 2 minutos para [TEMA].`,
                `O segredo dos milionários sobre [TEMA].`
            ];
        }

        const selected = availableTemplates.sort(() => 0.5 - Math.random()).slice(0, 3);
        
        selected.forEach((item, i) => {
            usedIdeas.add(item); // Marca como usada
            const final = item.replace("[TEMA]", currentTopic);
            html += `${i+1}️⃣ ${final}<br><br>`;
        });

        html += `<i>Peça "mais" para ideias inéditas ou "roteiro" para gravar!</i>`;
        return html;
    }

    function generateScript() {
        return `🎬 <b>ROTEIRO INÉDITO:</b><br>
        <div class="script-step"><b>HOOK (0-5s):</b> "Você já sentiu que está travado em ${currentTopic}? Eu descobri o porquê."</div>
        <div class="script-step"><b>CONTEÚDO (5-40s):</b> "O erro é focar no final. O segredo está aqui... (mostre o processo na tela)."</div>
        <div class="script-step"><b>CTA (40-60s):</b> "Comenta '${currentTopic.toUpperCase()}' se você quer a parte 2 detalhada!"</div>`;
    }

    function appendMessage(sender, text) {
        const chatBox = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerHTML = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
