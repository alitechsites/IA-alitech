<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralMind AI - Gerador de Ideias</title>
    <style>
        :root {
            --primary: #8a2be2;
            --dark: #0d1117;
            --text: #c9d1d9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .chat-container {
            width: 90%;
            max-width: 600px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .chat-header {
            padding: 20px;
            background: var(--primary);
            color: white;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        #chat-box {
            height: 400px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px;
            border-radius: 8px;
            line-height: 1.4;
        }

        .user {
            align-self: flex-end;
            background: #1f6feb;
            color: white;
        }

        .ai {
            align-self: flex-start;
            background: #30363d;
            border: 1px solid #444c56;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background: #0d1117;
            border-top: 1px solid #30363d;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background: #0d1117;
            color: white;
            outline: none;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🚀 ViralMind AI: Ideias & Roteiros</div>
    <div id="chat-box">
        <div class="message ai">Olá! Sobre qual nicho você quer ideias de vídeos virais hoje? (Ex: Culinária, Tech, Finanças)</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Pergunte algo...">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    function sendMessage() {
        const input = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        
        if (input.value.trim() === "") return;

        // Adiciona mensagem do usuário
        const userDiv = document.createElement('div');
        userDiv.className = 'message user';
        userDiv.innerText = input.value;
        chatBox.appendChild(userDiv);

        const prompt = input.value.toLowerCase();
        input.value = "";

        // Resposta Simulada da IA
        setTimeout(() => {
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai';
            
            if (prompt.includes("roteiro")) {
                aiDiv.innerHTML = "<b>🎬 Roteiro Viral Gerado:</b><br><br><b>0-3s:</b> O Gancho: 'Você não vai acreditar no que essa ferramenta faz...'<br><b>3-15s:</b> O Problema que todos sentem.<br><b>15-40s:</b> A Solução rápida.<br><b>Fim:</b> CTA: Siga para mais dicas!";
            } else {
                aiDiv.innerHTML = "<b>💡 Ideias Virais:</b><br>1. 'O erro que todo iniciante comete em " + prompt + "'.<br>2. '3 Ferramentas secretas para quem ama " + prompt + "'.<br>3. Desafio de 7 dias focados em resultados reais.";
            }
            
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 1000);
    }
</script>

</body>
</html>
